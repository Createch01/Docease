<div id="root"><div id="boot"><span class="spin"></span> Chargement de l'éditeur…</div></div>

<script type="text/babel" data-presets="react" src="editor/RxContactIcons.jsx"></script>
<script type="text/babel" data-presets="react" src="editor/rxEditorModel.jsx"></script>
<script type="text/babel" data-presets="react" src="editor/RxCanvas.jsx"></script>
<script type="text/babel" data-presets="react" src="editor/RxPanels.jsx"></script>
<script type="text/babel" data-presets="react" src="editor/RxEditorApp.jsx"></script>
<script type="text/babel" data-presets="react">
/* Demo host. In DocEase, render <RxPrescriptionEditor doctor={...}
   initialConfig={settingsService.getRxLayout()} onSave={settingsService.saveRxLayout} /> */

const DOCTOR = {
  name: 'Dr. Selma Amrani',
  speciality: 'Cardiologie — Médecine interne',
  phone: '+212 5 22 48 71 90',
  address: '14, rue Ibn Sina, Résidence Al Manar, Maârif, Casablanca 20330',
  email: 'contact@cabinet-amrani.ma',
  registrationNumber: 'MA-2019-04471',
  logoUrl: '',
};

let saved = null;
try { const s = localStorage.getItem('docease_rx_layout'); if (s) saved = JSON.parse(s); } catch (_) {}

const boot = () => {
  if (!window.RxPrescriptionEditor || !window.RxCanvas || !window.RxElementsPanel || !window.rxDefaultConfig) {
    return setTimeout(boot, 50);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    <window.RxPrescriptionEditor
      doctor={DOCTOR}
      initialConfig={saved}
      onSave={(cfg) => console.log('[DocEase] layout enregistré', cfg)} />
  );
};
boot();
</script>
